name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and Bible check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test validateBibles

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t zerno-backend:ci .
      - name: Health check
        run: |
          docker run -d --name zerno -p 8080:8080 zerno-backend:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/health && exit 0; sleep 2; done
          docker logs zerno
          exit 1
